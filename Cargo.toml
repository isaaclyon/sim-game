[workspace]
resolver = "3"
members = ["crates/sim", "crates/sim-wasm"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
disallowed_types = "deny"
disallowed_methods = "deny"
