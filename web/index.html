<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sim-game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1419; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px; border-radius: 8px;
        background: rgba(15, 20, 25, 0.85); color: #c9d4df;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre;
        pointer-events: none;
      }
      #controls { position: fixed; bottom: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
      #toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
      #toolbar button {
        background: #1c2530; color: #c9d4df; border: 1px solid #2e3a47; border-radius: 6px;
        padding: 6px 10px; font: 12px ui-monospace, Menlo, monospace; cursor: pointer;
        white-space: nowrap; pointer-events: auto;
      }
      #toolbar button:hover { border-color: #6b7b8f; }
      #toolbar button:focus-visible { outline: 2px solid #c9d4df; outline-offset: 2px; }
      #road-help { color: #c9d4df; background: #0f1419; padding: 6px 10px; font: 12px/1.5 ui-monospace, monospace; text-align: center; }
      #road-help:empty { display: none; }
      #toolbar button.active { background: #2f6fb0; border-color: #4a8bd0; color: white; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="controls">
    <div id="road-help" role="status" aria-live="polite"></div>
    <div id="toolbar">
      <button type="button" data-speed="0">pause</button>
      <button type="button" data-speed="1" class="active">1×</button>
      <button type="button" data-speed="3">3×</button>
      <button type="button" data-speed="10">10×</button>
      <button type="button" id="road" aria-pressed="false">straight road (R)</button>
      <button type="button" id="curve" aria-pressed="false">curved road (V)</button>
      <button type="button" id="main-road" aria-pressed="false" title="build main roads: faster, wider, carry long trips (M)">main road (M)</button>
      <button type="button" id="bulldoze" aria-pressed="false">bulldoze (B)</button>
      <button type="button" data-zone="1" aria-pressed="false" title="residential, low density (Z)">res low</button>
      <button type="button" data-zone="2" aria-pressed="false" title="residential, high density (Z twice)">res high</button>
      <button type="button" data-zone="3" aria-pressed="false" title="commercial, low density (X)">com low</button>
      <button type="button" data-zone="4" aria-pressed="false" title="commercial, high density (X twice)">com high</button>
      <button type="button" data-zone="5" aria-pressed="false" title="industrial, low density (C)">ind low</button>
      <button type="button" data-zone="6" aria-pressed="false" title="industrial, high density (C twice)">ind high</button>
      <button type="button" data-zone="0" aria-pressed="false" title="remove zoning (U)">unzone (U)</button>
    </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
